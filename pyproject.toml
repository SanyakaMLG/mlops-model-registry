[project]
name = "model-registry"
version = "0.2.0"
description = "MLOps Model Registry API with RBAC"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "sqlalchemy>=2.0.23",
    "psycopg2-binary>=2.9.9",
    "boto3>=1.28.85",
    "python-multipart>=0.0.6",
    "alembic>=1.12.1",
    "bcrypt>=4.1.2",
    "python-jose[cryptography]>=3.3.0",
    "email-validator>=2.1.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = false